name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    # The trusted publishing policy on nuget.org is bound to this environment, so a workflow run
    # outside it cannot obtain a publishing key even if it is this same workflow file.
    environment: nuget

    permissions:
      contents: write   # create the GitHub release
      id-token: write   # issue the OIDC token that nuget.org exchanges for a publishing key

    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink embeds commit information, which needs full history.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: >
          dotnet pack src/Integrious.Umbraco.SaneDatabaseAvailabilityCheck
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.value }}
          --output artifacts

      # Trusted publishing: exchanges a short-lived GitHub OIDC token for a nuget.org API key,
      # so there is no long-lived secret to store or rotate. The key lasts one hour and the OIDC
      # token is single use, so this must stay immediately before the push.
      - name: Log in to NuGet via OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # The nuget.org profile name that owns the trusted publishing policy, NOT an email
          # address. Held as a secret only to keep it out of the public workflow file; it is not
          # a credential, and nothing can be published with it alone.
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          generate_release_notes: true

      # Disabled along with the "umbraco-marketplace" tag, which this package does not currently
      # carry - see PackageTags in the csproj. Without that tag the Marketplace has nothing to sync,
      # so asking it to would only produce a confusing failure in the release log. Re-enable this
      # step at the same time as the tag.
      #
      # The Marketplace otherwise picks up new versions on its own schedule: new packages daily at
      # 0400 UTC, existing package details every two hours.
      #
      # - name: Ask the Umbraco Marketplace to sync
      #   continue-on-error: true
      #   run: >
      #     curl --fail --silent --show-error
      #     -X POST https://functions.marketplace.umbraco.com/api/InitiateSinglePackageSyncFunction
      #     -H 'Content-Type: application/json'
      #     -d '{"PackageId": "Integrious.Umbraco.SaneDatabaseAvailabilityCheck"}'
